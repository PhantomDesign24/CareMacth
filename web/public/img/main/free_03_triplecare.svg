      <stop offset="0" stop-color="#FFB25E"/>
      <stop offset="1" stop-color="#FF7A2E"/>
    </linearGradient>
  </defs>
  <circle cx="48" cy="48" r="40" fill="#FFF1E2"/>
  <!-- 3중 원 -->
